<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">GEO Radar · 品牌雷达</title>
  <desc id="desc">分平台问题规划、回答证据留存与品牌可见度观察。右侧雷达展示六个平台的观测入口，是工作流程示意。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081b28"/><stop offset="1" stop-color="#102e3a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3fd6bd" stop-opacity=".16"/><stop offset="1" stop-color="#3fd6bd" stop-opacity="0"/></radialGradient>
    <linearGradient id="sweep" x2="1" y2="1"><stop stop-color="#55e1c6" stop-opacity=".02"/><stop offset="1" stop-color="#55e1c6" stop-opacity=".24"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9de0dd" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1440" height="560" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="24" fill="url(#grid)"/>
  <circle cx="1120" cy="265" r="300" fill="url(#glow)"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
