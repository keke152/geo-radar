    <path d="M76 516H1364" stroke="#97c0c4" stroke-opacity=".11"/>
    <text x="76" y="540" fill="#6e939e" font-size="11" letter-spacing="1.7">ONE TOPIC. DISTINCT QUESTIONS. TRACEABLE EVIDENCE.</text>
    <text x="1364" y="540" fill="#6e939e" text-anchor="end" font-size="11">Workflow illustration</text>
