      <rect x="129" width="126" height="35" rx="17.5" fill="#143742" stroke="#4d8b91" stroke-opacity=".35"/><text x="192" y="23" text-anchor="middle">网页 / API 分开</text>
      <rect x="268" width="116" height="35" rx="17.5" fill="#143742" stroke="#4d8b91" stroke-opacity=".35"/><text x="326" y="23" text-anchor="middle">本地证据记录</text>
    </g>
    <g transform="translate(1104 277)">
