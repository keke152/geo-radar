      <circle cx="20" cy="20" r="6" fill="none" stroke="#77e4ce" stroke-opacity=".55"/>
      <path d="M20 20 29 11" stroke="#a8f4e3" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="20" r="2" fill="#a8f4e3"/>
      <text x="56" y="17" fill="#a1c1c9" font-size="12" letter-spacing="2.5">LOCAL-FIRST</text>
      <text x="56" y="36" fill="#e0efed" font-size="12" letter-spacing="1.9">BRAND OBSERVABILITY</text>
    </g>
    <text x="68" y="229" fill="#f4faf8" font-size="91" font-weight="700" letter-spacing="-4">GEO Radar<tspan x="76" dy="62" fill="#a1ecdb" font-size="38" font-weight="500" letter-spacing="6">品牌雷达</tspan></text>
    <text x="76" y="350" fill="#e1eceb" font-size="26" font-weight="400">看见品牌在 AI 回答中的真实表现</text>
    <text x="76" y="387" fill="#94b0ba" font-size="17">分平台问题规划 · 回答证据留存 · 品牌可见度观察</text>
